# pixi-build-mojo package: lets mojoshelf and `pixi add --git` consume this library as a source dependency.
[workspace]
name = "mojo-bento"
version = "0.1.3"
preview = ["pixi-build"]
channels = ["https://conda.modular.com/max", "https://prefix.dev/amarbaro/amarbaro", "conda-forge"]
platforms = ["linux-64"]

[package]
name = "mojo-bento"
version = "0.1.3"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.build.config.pkg]
path = "src/bento"
name = "bento"

[package.host-dependencies]
mojo-compiler = ">=1.2.0,<1.3"
mojo-aio = ">=0.1.1,<0.2"
mojo-gguf-core = ">=0.1.5,<0.2"
mojo-json = ">=0.1.4,<0.2"
mojo-posix = ">=0.1.6,<0.2"
mojo-safetensors = ">=0.1.5,<0.2"
mojo-systemd = ">=0.1.4,<0.2"

[package.build-dependencies]
mojo-compiler = ">=1.2.0,<1.3"
mojo-aio = ">=0.1.1,<0.2"
mojo-gguf-core = ">=0.1.5,<0.2"
mojo-json = ">=0.1.4,<0.2"
mojo-posix = ">=0.1.6,<0.2"
mojo-safetensors = ">=0.1.5,<0.2"
mojo-systemd = ">=0.1.4,<0.2"

[package.run-dependencies]
mojo-compiler = ">=1.2.0,<1.3"
mojo-aio = ">=0.1.1,<0.2"
mojo-gguf-core = ">=0.1.5,<0.2"
mojo-json = ">=0.1.4,<0.2"
mojo-posix = ">=0.1.6,<0.2"
mojo-safetensors = ">=0.1.5,<0.2"
mojo-systemd = ">=0.1.4,<0.2"
