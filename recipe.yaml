# rattler-build recipe, modular-community shape.
# Build locally: rattler-build build -r recipe.yaml -c https://conda.modular.com/max -c conda-forge
context:
  version: 0.1.3

package:
  name: "mojo-bento"
  version: ${{ version }}

source:
  - path: .

build:
  number: 0
  script:
    - mojo precompile src/bento -I ${{ PREFIX }}/lib/mojo -o ${{ PREFIX }}/lib/mojo/bento.mojoc

requirements:
  host:
    - mojo-compiler >=1.2.0,<1.3
    - mojo-aio
    - mojo-gguf-core
    - mojo-json
    - mojo-posix
    - mojo-safetensors
    - mojo-systemd
  build:
    - mojo-compiler >=1.2.0,<1.3
  run:
    - ${{ pin_compatible('mojo-compiler', upper_bound='x.x') }}
    - mojo-aio
    - mojo-gguf-core
    - mojo-json
    - mojo-posix
    - mojo-safetensors
    - mojo-systemd  # .mojoc loads only on the minor it was built with

tests:
  - script:
    - if: unix
      then:
        - mojo build -I src examples/quickstart.mojo -o quickstart
    files:
      source:
        - src/
        - examples/

about:
  homepage: https://github.com/amarbaro/mojo-bento
  license: Apache-2.0
  license_file: LICENSE
  summary: BentoML's serving core as a Mojo library
  repository: https://github.com/amarbaro/mojo-bento

extra:
  maintainers:
    - amarbaro.org
  project_name:
    - mojo-bento
